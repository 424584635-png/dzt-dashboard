name: 定时抓取并推送钉钉
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓取轩辕数据
        id: scrape
        continue-on-error: true
        run: node scrape.js
        env:
          CONFIG_COOKIE: ${{ vars.CONFIG_COOKIE }}
      - name: 生成看板页面
        run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: 推送钉钉
        if: steps.scrape.outcome == 'success'
        run: node dingtalk-notify.js
        env:
          DINGTALK_WEBHOOK: ${{ vars.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ vars.DINGTALK_SECRET }}
