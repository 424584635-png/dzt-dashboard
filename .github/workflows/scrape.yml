name: 定时抓取并推送钉钉
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓取轩辕数据
        id: scrape
        continue-on-error: true
        run: node scrape.js
        env:
          CONFIG_COOKIE: ${{ vars.CONFIG_COOKIE }}
      - name: 生成看板页面
        run: node build.js
      - name: 每日归档历史（北京时间 23 点档）
        run: |
          BJ_HOUR=$(TZ=Asia/Shanghai date +%H)
          if [ "$BJ_HOUR" = "23" ]; then
            git config user.email "bot@local"
            git config user.name "history-archiver"
            git add -f history.json data.json
            git commit -m "history: $(TZ=Asia/Shanghai date +%F)" || echo "无变化"
            git push || echo "推送失败"
            echo "已归档 $BJ_HOUR 点档历史"
          else
            echo "非归档时段（当前北京 $BJ_HOUR 点），跳过"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: 推送钉钉
        if: steps.scrape.outcome == 'success'
        run: node dingtalk-notify.js
        env:
          DINGTALK_WEBHOOK: ${{ vars.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ vars.DINGTALK_SECRET }}
